[project]
name = "llm-client"
version = "0.1.0"
description = "Provider-switching LLM client (Anthropic / OpenAI / Ollama / fake)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_client"]
