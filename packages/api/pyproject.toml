[project]
name = "clipdex-api"
version = "0.1.0"
description = "FastAPI app — search, guests, question generator."
requires-python = ">=3.12"
dependencies = [
    "clipdex-schema",
    "llm-client",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipdex_api"]
