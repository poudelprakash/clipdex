[project]
name = "clipdex-schema"
version = "0.1.0"
description = "Pydantic models shared across clipdex packages."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipdex_schema"]
