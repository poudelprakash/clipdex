[project]
name = "clipdex-codegen"
version = "0.1.0"
description = "Emit TS types from clipdex-schema for the web app."
requires-python = ">=3.12"
dependencies = ["clipdex-schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipdex_codegen"]
