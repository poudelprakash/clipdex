[project]
name = "clipdex-ingest"
version = "0.1.0"
description = "YouTube ingest worker (Data API + yt-dlp/Whisper fallback)."
requires-python = ">=3.12"
dependencies = [
    "clipdex-schema",
    "httpx>=0.27",
    "webvtt-py>=0.5",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
fallback = [
    "yt-dlp>=2024.10",
    "openai-whisper>=20240930",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipdex_ingest"]
