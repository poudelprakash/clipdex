[project]
name = "clipdex-ingest"
version = "0.1.0"
description = "YouTube ingest worker (Data API + yt-dlp/Whisper fallback)."
requires-python = ">=3.12"
dependencies = [
    "clipdex-schema",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipdex_ingest"]
